name: tenant-control-plane

# Local-development credentials only; nothing in this file is a real secret.
x-database-url: &database-url postgresql://tenants:tenants@postgres:5432/tenants
x-rabbitmq-url: &rabbitmq-url amqp://tenants:tenants@rabbitmq:5672/

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tenants
      POSTGRES_PASSWORD: tenants
      POSTGRES_DB: tenants
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenants -d tenants"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq  # RabbitMQ keys its data dir by host name; keep it stable
    environment:
      RABBITMQ_DEFAULT_USER: tenants
      RABBITMQ_DEFAULT_PASS: tenants
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI: http://localhost:15672 (tenants / tenants)
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      # Stricter than `ping`: passes only once the AMQP listener accepts connections.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  control-plane:
    image: tenant-control-plane:runtime
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: *database-url
      RABBITMQ_URL: *rabbitmq-url
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Worker simulator. Scenarios via environment variables, for example in PowerShell:
  #   $env:WORKER_FAIL_RATE=1; docker compose up -d worker
  # or via flags on a one-off run:
  #   docker compose stop worker
  #   docker compose run --rm worker --fail-rate=1 --duplicate-rate=0.5 --reorder
  worker:
    image: tenant-control-plane:runtime
    build:
      context: .
      target: runtime
    entrypoint: ["python", "-m", "worker.main"]
    environment:
      RABBITMQ_URL: *rabbitmq-url
      WORKER_FAIL_RATE: ${WORKER_FAIL_RATE:-0}
      WORKER_MIN_DELAY_MS: ${WORKER_MIN_DELAY_MS:-500}
      WORKER_MAX_DELAY_MS: ${WORKER_MAX_DELAY_MS:-2000}
      WORKER_DUPLICATE_RATE: ${WORKER_DUPLICATE_RATE:-0}
      WORKER_REORDER: ${WORKER_REORDER:-false}
      WORKER_SEED: ${WORKER_SEED:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      LOG_LEVEL: INFO
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  # Single quality gate: format check, lint, type check, security scans
  # and the test suite.
  #   docker compose --profile tools run --rm --build check
  check:
    image: tenant-control-plane:dev
    build:
      context: .
      target: dev
    profiles: ["tools"]
    command: ["sh", "scripts/check.sh"]

  # Formats and auto-fixes the code in place on your machine.
  #   docker compose --profile tools run --rm --build fmt
  fmt:
    image: tenant-control-plane:dev
    build:
      context: .
      target: dev
    profiles: ["tools"]
    volumes:
      - .:/srv
    command: ["sh", "-c", "ruff format . && ruff check --fix ."]

volumes:
  pgdata:
  rabbitmqdata:
