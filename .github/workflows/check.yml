# Runs the same two commands a reviewer runs: boot the stack, then the full quality gate
# and test suite (unit, API contract and integration tests against the real services).
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Boot the stack
        run: docker compose up --build -d --wait

      - name: Quality gate and full test suite
        run: docker compose --profile tools run --rm --build check

      - name: Service logs (on failure)
        if: failure()
        run: docker compose logs --no-color
